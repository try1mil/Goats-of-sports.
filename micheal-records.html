<!DOCTYPE html>

<style>

body, html {
    background-color : red;
}

.rubik-mono-one-regular {
  font-family: "Rubik Mono One", monospace;
  font-weight: 400;
  font-style: normal;
  font-size:1.5rem;
}

.races {
    background-color:#FFC814;
    border:1px solid #FFC814;
    width:20px;
    height:30px;
    animation-duration:3s;
    animation-name: races;
    animation-fill-mode: forwards;

}

.img {
    width:auto;
    height:400px;
    border: 10px solid white;
    border-radius:20px;
    margin-top:0px;
}



.pole-positions {
    background-color:#FFC814;
    border:1px  #FFC814;
    width:20px;
    height:30px;
    animation-duration:3s;
    animation-name:pole-positions;
    animation-fill-mode:forwards;
}

.championships {
    background-color:#FFC814;
    border:1px  #FFC814;
    width:20px;
    height:30px;
    animation-duration:3s;
    animation-name:championships;
    animation-fill-mode:forwards;
}

@keyframes races {
    0% {
        transform : scale(1,1);
    }
    100% {
        transform: scale(130,1);
    }
}

@keyframes pole-positions {
    0% {
        transform : scale(1,1);
    }
    100% {
        transform:scale(42,1);
    }
}

@keyframes championships {
    0% {
        transform: scale(1,1);
    }
    100% {
        transform:scale(17,1);
    }
}




</style>

<body>
<div class = "rubik-mono-one-regular">
    <div>
