<!DOCTYPE html>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            position: relative; 
        }

        .fullscreen  {
            display: flex; 
            width: 100vw; 
            height: 100vh;
        }
        .fullscreen  img {
            width: 25%;         
            height: 100%;       
            object-fit: cover;  
            display: block;     
        }
        
    </style>  
    <body>
    <div class="fullscreen ">
        <img src = "https://i.pinimg.com/736x/26/f4/94/26f4941a11ba3a64a562bf9bc8315cf0.jpg" >
        <img src = "https://i.pinimg.com/736x/1c/cb/fa/1ccbfa97164277e0fb1244a38523e3cf.jpg" >

        <img src = "https://i.pinimg.com/736x/35/e0/15/35e015348754b7476a8f93f7667c0927.jpg" >
    </div>
